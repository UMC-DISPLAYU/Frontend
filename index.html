<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DISPLAYU</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ECECF2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      스플래시(#483): JS 를 받기 전부터 보여야 해서 여기에 둔다. 값은 디자인 전달 문서(로딩 화면 SPEC 1장)와 같다.
      홈으로 처음 들어올 때만, 브라우저당 한 번 뜬다. 홈 헤더가 그려지면 useSplashHandoff 가 홈으로 잇는다.
    -->
    <style>
      #du-splash {
        display: none;
      }
      html.sp-pre {
        overflow: hidden;
        background: #fff;
      }
      html.sp-pre #du-splash {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 1000;
        overflow: hidden;
        background: #fff;
      }
      html.sp-pre:not(.sp-go) body > :not(#du-splash) {
        visibility: hidden !important;
      }
      /* 올라오는 동안 헤더 로고 자리는 스플래시 로고가 대신한다 */
      html.sp-pre [data-splash-header] {
        visibility: hidden;
      }
      #du-splash .sp-logo {
        position: absolute;
        top: calc(50% - 14.15295px);
        left: calc(50% - 62px);
        width: 124px;
        height: 28.3059px;
        overflow: visible;
        fill: #18181b;
        transform-origin: 0 0;
      }

      /* 1) 로고 조각: 조각마다 --dy(시작 거리) · --d(지연) · --t(길이)가 다르다 */
      html.sp-pre #du-splash .sp-p {
        animation: sp-rise var(--t) linear var(--d) both;
      }
      @keyframes sp-rise {
        0% {
          transform: translateY(var(--dy));
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }
        76% {
          transform: translateY(var(--ov));
          animation-timing-function: cubic-bezier(0.45, 0, 0.2, 1);
        }
        100% {
          transform: translateY(0);
        }
      }
      html.sp-pre #du-splash .sp-dot {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation-name: sp-drop;
      }
      @keyframes sp-drop {
        0% {
          opacity: 0;
          transform: translateY(var(--dy));
          animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45);
        }
        16% {
          opacity: 1;
        }
        62% {
          opacity: 1;
          transform: translateY(0) scale(1, 1);
          animation-timing-function: cubic-bezier(0.2, 0.8, 0.3, 1);
        }
        76% {
          transform: translateY(0) scale(1.12, 0.66);
          animation-timing-function: cubic-bezier(0.3, 0, 0.2, 1);
        }
        100% {
          transform: translateY(0) scale(1, 1);
        }
      }

      /* 2) 연결: 흰 바탕은 투명해지고, 로고는 헤더 자리로, 홈의 검은 영역 + 흰 시트는 아래에서 올라온다 */
      html.sp-go #du-splash {
        background: transparent;
      }
      html.sp-go #du-splash .sp-logo {
        animation: sp-logo-move 720ms cubic-bezier(0.65, 0, 0.2, 1) both;
      }
      html.sp-go [data-splash-sheet] {
        animation: sp-sheet-up 720ms cubic-bezier(0.65, 0, 0.2, 1) both;
      }
      html.sp-go nav[aria-label='하단 메뉴'] {
        animation: sp-fade 720ms cubic-bezier(0.65, 0, 0.2, 1) both;
      }
      @keyframes sp-logo-move {
        to {
          transform: translate(var(--sp-dx), var(--sp-dy)) scale(var(--sp-sx), var(--sp-sy));
        }
      }
      @keyframes sp-sheet-up {
        from {
          transform: translateY(var(--sp-h, 100vh));
        }
        to {
          transform: none;
        }
      }
      @keyframes sp-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* 움직임 줄이기: 조각 이동 · 연결 이동 없이 투명도만 */
      @media (prefers-reduced-motion: reduce) {
        html.sp-pre #du-splash .sp-p,
        html.sp-pre #du-splash .sp-dot {
          animation: sp-fade 0.3s linear both;
        }
        html.sp-go #du-splash .sp-logo,
        html.sp-go [data-splash-sheet],
        html.sp-go nav[aria-label='하단 메뉴'] {
          animation: none;
        }
      }
    </style>
    <script>
      (function () {
        var path = location.pathname;
        if (path !== '/' && path !== '/home') return;
        // 저장소를 못 쓰면 한 번만 보여 줄 수 없으니 띄우지 않는다
        try {
          if (localStorage.getItem('du.splash')) return;
          localStorage.setItem('du.splash', '1');
        } catch (e) {
          return;
        }

        var root = document.documentElement;
        var meta = document.querySelector('meta[name="theme-color"]');
        root.classList.add('sp-pre');
        if (meta) {
          meta.setAttribute('data-splash-prev', meta.getAttribute('content'));
          meta.setAttribute('content', '#ffffff');
        }

        // 안전장치: 홈이 그려지지 않아도(다른 화면으로 넘어감 · 스크립트 오류) 스플래시에 갇히지 않게 한다
        setTimeout(function () {
          if (root.classList.contains('sp-go')) return;
          var splash = document.getElementById('du-splash');
          if (splash) splash.remove();
          root.classList.remove('sp-pre');
          if (meta) meta.setAttribute('content', meta.getAttribute('data-splash-prev'));
        }, 7000);
      })();
    </script>
  </head>
