<!doctype html>
<html lang="ko">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DISPLAYU</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ECECF2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      스플래시(#483, #513): JS 를 받기 전부터 보여야 해서 여기에 둔다. 값은 디자인 전달 문서(스플래시 SPEC 11-14 3차 1장)와 같다.
      홈으로 처음 들어올 때만, 브라우저당 한 번 뜬다. 홈 헤더가 그려지면 useSplashHandoff 가 홈으로 잇는다.
    -->
    <style>
      #du-splash {
        display: none;
      }
      html.sp-pre {
        overflow: hidden;
        background: #fff;
      }
      html.sp-pre #du-splash {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 1000;
        overflow: hidden;
        background: #fff;
      }
      html.sp-pre:not(.sp-go) body > :not(#du-splash) {
        visibility: hidden !important;
      }
      /* 올라오는 동안 헤더 로고 자리는 스플래시 로고가 대신한다 */
      html.sp-pre [data-splash-header] {
        visibility: hidden;
      }
      #du-splash .sp-logo {
        position: absolute;
        top: calc(50% - 14.15295px);
        left: calc(50% - 62px);
        width: 124px;
        height: 28.3059px;
        transform-origin: 0 0;
      }

      /*
        1) 로고: 글자마다 [창(overflow: hidden) > 그 글자만 든 SVG]로 나눠 SVG 요소 자체를 움직인다.
        한 SVG 안의 path 를 clip-path 와 함께 움직이면 프레임마다 다시 그려서 번들을 받는 동안 끊긴다.
      */
      #du-splash .sp-zoom,
      #du-splash .sp-mv {
        position: absolute;
        inset: 0;
      }
      #du-splash .sp-win {
        position: absolute;
        left: -60px;
        width: 244px;
        overflow: hidden;
      }
      /* 올라오는 글자: 기준선 아래는 안 보인다 */
      #du-splash .sp-b {
        top: -4px;
        height: 27.2px;
      }
      /* 내려오는 글자(p · y): 윗부분만 자른다 */
      #du-splash .sp-f {
        top: -0.2px;
        height: 29px;
      }
      /* 마침표: 자르지 않는다 */
      #du-splash .sp-n {
        top: -40px;
        height: 80px;
      }
      #du-splash .sp-piece {
        position: absolute;
        left: 60px;
        width: 124px;
        height: 28.3059px;
        overflow: visible;
        fill: #18181b;
        will-change: transform, opacity;
      }
      #du-splash .sp-b .sp-piece {
        top: 4px;
      }
      #du-splash .sp-f .sp-piece {
        top: 0.2px;
      }
      #du-splash .sp-n .sp-piece {
        top: 40px;
      }

      /* 시작: D와 U만 붙여서(간격 1.6) 1.7배 */
      #du-splash .sp-zoom {
        transform: scale(1.7);
        transform-origin: 62px 14.15px;
      }
      #du-splash .sp-mv-d {
        transform: translateX(43.8px);
      }
      #du-splash .sp-mv-u {
        transform: translateX(-37.246px);
      }
      /* 벌어짐: D는 왼쪽 · U는 오른쪽, 크기는 제 크기로 */
      #du-splash.sp-spread .sp-zoom,
      #du-splash.sp-spread .sp-mv-d,
      #du-splash.sp-spread .sp-mv-u {
        transform: none;
        transition: transform 480ms cubic-bezier(0.65, 0, 0.2, 1);
      }
      #du-splash .sp-mid,
      #du-splash .sp-dot {
        opacity: 0;
      }
      /* 움직임 시작 전에는 DU 도 숨긴다. 안 숨기면 떠 있던 DU 가 사라졌다 다시 올라와 덜컥거린다 */
      #du-splash:not(.sp-run) .sp-du {
        opacity: 0;
      }
      #du-splash.sp-run .sp-du {
        animation: sp-rise-du calc(var(--t) + 150ms) linear var(--d) both;
      }
      #du-splash.sp-spread .sp-mid {
        animation:
          sp-rise var(--t) linear var(--d) both,
          sp-on 1ms linear var(--d) both;
      }
      #du-splash.sp-spread .sp-dot {
        opacity: 1;
        transform-origin: 121.45px 22.6px;
        animation: sp-drop var(--t) linear var(--d) both;
      }
      @keyframes sp-on {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /*
        iOS Safari 는 움직임 시작 뒤 처음 그리기까지 0.05초쯤 비어서, 바로 올라오면 DU 가 거의 다 올라온 채로 나타난다.
        그래서 앞 150ms(610ms 중 24.59%)는 기준선 아래에 가만히 두고 그 뒤에 sp-rise 와 같은 움직임을 한다.
      */
      @keyframes sp-rise-du {
        0% {
          transform: translateY(var(--dy));
          animation-timing-function: linear;
        }
        24.59% {
          transform: translateY(var(--dy));
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }
        81.9% {
          transform: translateY(var(--ov));
          animation-timing-function: cubic-bezier(0.45, 0, 0.2, 1);
        }
        100% {
          transform: translateY(0);
        }
      }
      @keyframes sp-rise {
        0% {
          transform: translateY(var(--dy));
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }
        76% {
          transform: translateY(var(--ov));
          animation-timing-function: cubic-bezier(0.45, 0, 0.2, 1);
        }
        100% {
          transform: translateY(0);
        }
      }
      @keyframes sp-drop {
        0% {
          opacity: 0;
          transform: translateY(var(--dy));
          animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45);
        }
        16% {
          opacity: 1;
        }
        62% {
          opacity: 1;
          transform: translateY(0) scale(1, 1);
          animation-timing-function: cubic-bezier(0.2, 0.8, 0.3, 1);
        }
        76% {
          transform: translateY(0) scale(1.12, 0.66);
          animation-timing-function: cubic-bezier(0.3, 0, 0.2, 1);
        }
        100% {
          transform: translateY(0) scale(1, 1);
        }
      }

      /* 2) 연결: 흰 바탕은 투명해지고, 로고는 헤더 자리로, 홈의 검은 영역 + 흰 시트는 아래에서 올라온다 */
      html.sp-go #du-splash {
        background: transparent;
      }
      html.sp-go #du-splash .sp-logo {
        animation: sp-logo-move 720ms cubic-bezier(0.65, 0, 0.2, 1) both;
      }
      html.sp-go [data-splash-sheet] {
        animation: sp-sheet-up 720ms cubic-bezier(0.65, 0, 0.2, 1) both;
      }
      html.sp-go nav[aria-label='하단 메뉴'] {
        animation: sp-fade 720ms cubic-bezier(0.65, 0, 0.2, 1) both;
      }
      @keyframes sp-logo-move {
        to {
          transform: translate(var(--sp-dx), var(--sp-dy)) scale(var(--sp-sx), var(--sp-sy));
        }
      }
      @keyframes sp-sheet-up {
        from {
          transform: translateY(var(--sp-h, 100vh));
        }
        to {
          transform: none;
        }
      }
      @keyframes sp-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* 움직임 줄이기: DU 장면 · 벌어짐 · 연결 이동 없이 완성된 로고가 투명도만으로 */
      @media (prefers-reduced-motion: reduce) {
        #du-splash .sp-zoom,
        #du-splash .sp-mv-d,
        #du-splash .sp-mv-u {
          transform: none;
          transition: none;
        }
        #du-splash.sp-run .sp-piece {
          opacity: 1;
          animation: sp-fade 0.3s linear both;
        }
        html.sp-go #du-splash .sp-logo,
        html.sp-go [data-splash-sheet],
        html.sp-go nav[aria-label='하단 메뉴'] {
          animation: none;
        }
      }
    </style>
    <script>
      (function () {
        var path = location.pathname;
        if (path !== '/' && path !== '/home') return;
        // OAuth 콜백(?accessToken=)은 첫 진입이 아니다. 로그인 전 보던 화면으로 곧바로 돌아가므로 띄우지도 기록하지도 않는다
        if (/[?&]accessToken=/.test(location.search)) return;
        // 저장소를 못 쓰면 한 번만 보여 줄 수 없으니 띄우지 않는다
        try {
          if (localStorage.getItem('du.splash')) return;
          localStorage.setItem('du.splash', '1');
        } catch (e) {
          return;
        }

        var root = document.documentElement;
        var meta = document.querySelector('meta[name="theme-color"]');
        root.classList.add('sp-pre');
        if (meta) {
          meta.setAttribute('data-splash-prev', meta.getAttribute('content'));
          meta.setAttribute('content', '#ffffff');
        }

        // 안전장치: 홈이 그려지지 않아도(다른 화면으로 넘어감 · 스크립트 오류) 스플래시에 갇히지 않게 한다
        setTimeout(function () {
          if (root.classList.contains('sp-go')) return;
          var splash = document.getElementById('du-splash');
          if (splash) splash.remove();
          root.classList.remove('sp-pre');
          if (meta) meta.setAttribute('content', meta.getAttribute('data-splash-prev'));
        }, 7000);
      })();
    </script>

    <script>
      (function () {
        var root = document.documentElement;
        var splash = document.getElementById('du-splash');
        if (!splash || !root.classList.contains('sp-pre')) return;

        // 시간은 디자인 전달 문서(스플래시 SPEC 1-2)와 같다. 0ms 는 움직임을 시작하는 때
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var PRIME_MS = reduceMotion ? 0 : 150;
        var SPREAD_AT = 520 + PRIME_MS;
        var LOGO_DONE_AT = reduceMotion ? 300 : 1270 + PRIME_MS;
        var HOLD_MS = 150;
        var started = false;

        function start() {
          if (started) return;
          started = true;
          splash.classList.add('sp-run');
          if (!reduceMotion) {
            setTimeout(function () {
              splash.classList.add('sp-spread');
            }, SPREAD_AT);
          }
          // useSplashHandoff 가 이 신호를 받고, 홈 헤더가 그려져 있으면 홈으로 잇는다
          setTimeout(function () {
            splash.setAttribute('data-logo-done', '');
            splash.dispatchEvent(new Event('du-splash-logo-done'));
          }, LOGO_DONE_AT + HOLD_MS);
        }

        // 스크립트가 한창 도는 중에 시작하면 첫 장면을 건너뛰어 DU 가 덜컥 나타난다.
        // DOMContentLoaded 뒤 두 번 그린 다음 시작하고, 프레임이 안 오는 환경을 위해 안전장치를 둔다
        function afterTwoFrames() {
          requestAnimationFrame(function () {
            requestAnimationFrame(start);
          });
          setTimeout(start, 250);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', afterTwoFrames);
          setTimeout(start, 1200);
        } else {
          afterTwoFrames();
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
